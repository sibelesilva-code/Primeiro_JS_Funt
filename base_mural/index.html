<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural da equipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <span class="etiqueta">MURAL DA EQUIPE</span>
    <h1>Os avisos da nossa equipe</h1>
    <section aria-labelledby="titulo-aviso" aria-live="polite">
      <h2 id="titulo-aviso">Nenhum aviso aberto</h2>
      <p id="descricao-aviso">Clique no botão para ler.</p>
    </section>
    <button id="botao-aviso" type="button">Mostrar aviso</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
